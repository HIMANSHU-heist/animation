const STEPS=[
["Overview","VERITAS knows when not to trade","ML proposes, LLMs advise, and only a deterministic C++ gate can approve an order. Built for NIFTY 50 paper trading."],
["The problem","Why naive AI bots fail","Hallucinated prices, hijacked prompts and a 0.146% round-trip cost. Trading every day for 243 days lost ₹5,527."],
["Step 1 · Firewall","DataClock: zero look-ahead","At 08:30 IST today's bars do not exist. Indian assets lag to 15:45 IST, US and FX to 00:00 UTC. Any future date in a prompt raises LeakageError."],
["Step 2 · Maths","Mondrian conformal prediction","At 90% coverage, {UP, DOWN} means ambiguity, so the bot abstains (185 test days). Only a single-class set with edge above 0.146% may trade."],
["Step 3 · Council","The LLM advisory council","Cue, News, Regime and Drift agents feed the Strategy agent. It can only agree with the ML direction or wait. It can never flip a trade."],
["Step 4 · Scrutiny","Adversarial red-team veto","Every proposal is attacked for contradictions and sizing errors. 5 of 6 historical vetoes were correct, saving ₹395."],
["Step 5 · Execution","Deterministic C++ risk gate","Six checks in a standalone C++17 engine. No LLM can place an order. One failed check means ABSTAIN with a counterfactual explanation."],
["Step 6 · Cyber defence","Prompt-injection invariance","Even a hijacked LLM shouting BUY 100% is stopped by the sanitizer, the neutral fallback, and a gate that clips size and demands a statistical edge."],
["Step 7 · Audit","SHA-256 audit trail","An append-only hash chain. risk_engine --verify walks all 581 lines, and changing one byte makes it report BROKEN."],
["Result","Safer by construction","57 trades instead of 243, costs down from ₹7,055 to ₹1,655, drawdown from 0.642% to 0.253%, and every decision verified."]];
const N=STEPS.length,DUR=18,now=()=>performance.now()/1000;
/* ===== VOICEOVER: narration.mp3 (3:00) - slide start times in seconds. Adjust here if a slide feels early/late. ===== */
const TS=[0,18.73,40.76,53.70,75.57,96.43,112.79,131.18,150.94,162.37],LEAD=0.25,vo=document.getElementById("vo");
let audioBad=false,lockUntil=0,playTok=0,fbT=null;
vo.src="narration.mp3";const audioReady=Promise.resolve();
vo.addEventListener("error",()=>{if(vo.error&&vo.error.code===4)audioBad=true});
const stepAt=t=>{let i=0;for(let k=0;k<TS.length;k++)if(t>=TS[k]-LEAD)i=k;return i};
const segEnd=i=>i<N-1?TS[i+1]-LEAD:1e9;
let cur=-1,mode="auto",playing=true,started=false,acc=0,lastT=now(),mx=0,my=0;
const cap=$("#cap"),dots=$("#dots"),bar=$("#bar i");
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function showNum(){let t=String(cur+1).padStart(2,"0")+" / "+N;
  if(started&&mode==="auto"){let left;if(!audioBad){const tot=(vo.duration||179.7);left=tot-vo.currentTime}else left=(N-cur-1)*DUR+Math.max(0,DUR-acc);t+=" · "+fmt(left)}
  $("#num").textContent=t}
setInterval(showNum,500);
for(let i=0;i<N;i++){const a=document.createElement("a");a.title=STEPS[i][1];a.onclick=()=>go(i);dots.appendChild(a)}
function go(i,fromAudio){
  if(i<0||i>=N||i===cur)return;
  if(cur>=0)leaving.push({S:scenes[cur],t0:now()});
  const S=scenes[i],k=leaving.findIndex(l=>l.S===S);if(k>=0)leaving.splice(k,1);
  S.root.visible=true;S.root.scale.setScalar(1);S.t0=now();acc=0;cur=i;
  const s=STEPS[i];$("#tg").textContent=s[0];$("#tt").textContent=s[1];$("#tx").textContent=s[2];
  showNum();
  cap.classList.remove("in");void cap.offsetWidth;cap.classList.add("in");
  [...dots.children].forEach((d,j)=>d.classList.toggle("on",j===i));
  if(started&&!fromAudio)playFrom(i);
}
function playFrom(n){
  if(audioBad)return;const my=++playTok;lockUntil=performance.now()+2000;
  audioReady.then(()=>{if(my!==playTok)return;
    const doIt=()=>{if(my!==playTok)return;lockUntil=performance.now()+800;try{vo.currentTime=TS[n]}catch(e){}
      const p=vo.play();if(p&&p.catch)p.catch(e=>{if(e&&e.name==="NotSupportedError")audioBad=true;syncPP()});playing=true;syncPP()};
    if(vo.readyState>=1)doIt();else vo.addEventListener("loadedmetadata",doIt,{once:true})})}
function syncPP(){if(audioBad)return;$("#pp").textContent=vo.paused?(vo.ended?"↻ Replay":"▶ Play"):"⏸ Pause"}
vo.addEventListener("play",syncPP);vo.addEventListener("pause",syncPP);vo.addEventListener("ended",()=>{playing=false;syncPP()});
/* keep slides locked to the voice */
setInterval(()=>{if(!started||audioBad||performance.now()<lockUntil||vo.paused||vo.seeking)return;
  const t=vo.currentTime;
  if(mode==="auto"){const i=stepAt(t);if(i!==cur)go(i,true)}
  else if(t>=segEnd(cur))vo.pause()},100);
function setMode(m){mode=m;playing=m==="auto";acc=0;document.body.classList.toggle("manual",m==="manual");
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));$("#pp").textContent="⏸ Pause";
  if(started&&!audioBad){if(m==="auto"){playFrom(cur)}else{playTok++;if(!vo.paused&&vo.currentTime>=segEnd(cur))vo.pause()}}}
function start(m){mode=m;started=true;setMode(m);$("#splash").classList.add("off");const S=scenes[cur];S.t0=now();acc=0;if(!audioBad)playFrom(cur)}
$("#sa").onclick=()=>start("auto");$("#sm").onclick=()=>start("manual");
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$("#nx").onclick=()=>go((cur+1)%N);$("#pv").onclick=()=>go(cur-1);
$("#rp").onclick=()=>{scenes[cur].t0=now();acc=0;if(started)playFrom(cur)};
$("#pp").onclick=()=>{
  if(audioBad){playing=!playing;$("#pp").textContent=playing?"⏸ Pause":"▶ Play";return}
  if(vo.ended){go(0,true);playFrom(0);return}
  if(vo.paused){playTok++;const p=vo.play();if(p&&p.catch)p.catch(()=>{});playing=true}else{vo.pause();playing=false}syncPP()};
addEventListener("keydown",e=>{if(!started)return;
  if(e.key==="ArrowRight"||e.key==="PageDown"){$("#nx").click()}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){$("#pv").click()}
  else if(e.key===" "){e.preventDefault();mode==="auto"?$("#pp").click():$("#nx").click()}});
let tx0=null;addEventListener("touchstart",e=>{tx0=e.touches[0].clientX},{passive:true});
addEventListener("touchend",e=>{if(tx0===null||!started)return;const d=e.changedTouches[0].clientX-tx0;if(Math.abs(d)>70)(d<0?$("#nx"):$("#pv")).click();tx0=null});
addEventListener("pointermove",e=>{mx=(e.clientX/innerWidth-.5)*2;my=(e.clientY/innerHeight-.5)*2});

/* starfield */
const stars=(()=>{const n=900,p=new Float32Array(n*3);for(let i=0;i<n;i++){p[i*3]=(Math.random()-.5)*130;p[i*3+1]=(Math.random()-.5)*80;p[i*3+2]=-25-Math.random()*45}
  const g=new T.BufferGeometry();g.setAttribute("position",new T.BufferAttribute(p,3));const s=new T.Points(g,new T.PointsMaterial({color:0x38bdf8,size:.2,transparent:true,opacity:.55}));sc.add(s);return s})();
function rs(){const w=innerWidth,h=innerHeight;R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener("resize",rs);rs();
const fit=S=>{const t=Math.tan(T.MathUtils.degToRad(20));return Math.max(S.H/2/t,S.W/2/(t*cam.aspect))*1.08};

function frame(){
  const n=now(),dt=Math.min(n-lastT,.1);lastT=n;
  for(let i=leaving.length-1;i>=0;i--){const l=leaving[i],k=1-(n-l.t0)/.3;if(k<=0){l.S.root.visible=false;l.S.root.scale.setScalar(1);leaving.splice(i,1)}else l.S.root.scale.setScalar(Math.max(k,.001))}
  const S=scenes[cur];
  if(S){
    const st=S.st=n-S.t0;
    S.items.forEach(({g,d})=>{const p=cl((st-d)/.6,0,1);g.scale.setScalar(p<=0?1e-4:Math.max(eb(p),1e-4))});
    S.raws.forEach(r=>r.g.visible=st>=r.d);
    S.loops.forEach(f=>f(st));
    if(audioBad&&started&&mode==="auto"&&playing){acc+=dt;if(acc>DUR)go((cur+1)%N)}
    else if(!audioBad&&started){const a=TS[cur],b=cur<N-1?TS[cur+1]:(vo.duration||a+20);acc=cl((vo.currentTime-a)/(b-a),0,1)*DUR}
    const d=fit(S)*(1+.3*(1-eio(cl(st/1.6,0,1)))),sw=Math.sin(n*.22)*.1;
    cam.position.set(Math.sin(sw)*d+mx*1.2,1.4-my*.8,Math.cos(sw)*d);
    cam.lookAt(0,-S.H*.11,0);
    bar.style.width=((cur+(mode==="auto"?cl(acc/DUR,0,1):1))/N*100)+"%";
  }
  stars.rotation.y+=dt*.004;
  R.render(sc,cam);requestAnimationFrame(frame);
}

/* subtitles synced to the voice */
const PH=STEPS.map(s=>{let p=s[2].split(/(?<=[.;:])\s+|(?<=,)\s+/),o=[];p.forEach(x=>{if(o.length&&o[o.length-1].length<28)o[o.length-1]+=" "+x;else o.push(x)});if(o.length>1&&o[o.length-1].length<28){const l=o.pop();o[o.length-1]+=" "+l}return o});
const sub=$("#sub");let subK="";
function showSub(t){if(t!==subK){subK=t;sub.innerHTML=t?"<span></span>":"";if(t)sub.firstChild.textContent=t}}
setInterval(()=>{if(!started){showSub("");return}
  const P=PH[cur];if(!P)return;let f;
  if(!audioBad){const a=TS[cur],b=cur<N-1?TS[cur+1]:(vo.duration||a+20);f=cl((vo.currentTime-a)/(b-a),0,.999)}else f=cl(acc/DUR,0,.999);
  const w=P.map(x=>x.length),tot=w.reduce((p,q)=>p+q,0);let c=0,k=P.length-1;
  for(let i=0;i<P.length;i++){c+=w[i]/tot;if(f<c){k=i;break}}
  showSub(P[k])},120);
setMode("auto");go(0);frame();
})();
